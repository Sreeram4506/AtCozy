services:
  # ---------------------------------------------------------------------------
  # 1. ATCOZY BACKEND (NODE.JS WEB SERVICE)
  # ---------------------------------------------------------------------------
  - type: web
    name: atcozy-api
    runtime: node
    plan: free # Free tier supported
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # User must set in dashboard
      - key: JWT_SECRET
        sync: false # User must set in dashboard
      - key: BETTER_AUTH_SECRET
        sync: false # User must set in dashboard
      - key: STRIPE_SECRET_KEY
        sync: false # User must set in dashboard
      - key: FRONTEND_URL
        fromService:
          type: static
          name: atcozy-web
          property: url
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: atcozy-api
          property: url
          suffix: /api/auth

  # ---------------------------------------------------------------------------
  # 2. ATCOZY FRONTEND (STATIC SITE)
  # ---------------------------------------------------------------------------
  - type: static
    name: atcozy-web
    runtime: static
    buildCommand: npm install && npm run build:client
    staticPublishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: atcozy-api
          property: url
          suffix: /api
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false # User must set in dashboard
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
